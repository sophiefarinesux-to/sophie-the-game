<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sophie's Studio</title>
  <meta name="description" content="Explore Sophie's cosy pixel studio to discover her UX work and story." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪴</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="whimsy">
  <main id="whimsy">
    <div class="stage">
      <canvas id="room" tabindex="0" aria-label="Sophie's studio. Click objects to learn about Sophie, or use arrow keys to walk and Enter to interact."></canvas>
      <div id="tooltip" hidden></div>
      <div id="bubble" hidden></div>
    </div>
  </main>

  <section id="boring" hidden>
    <div class="boring-wrap">
      <h1>Sophie <small>UX Designer · Toronto</small></h1>
      <div id="boring-content"></div>
    </div>
  </section>

  <div id="dialog" hidden>
    <div class="card" role="dialog" aria-modal="true">
      <button id="dlg-close" class="x" aria-label="Close">×</button>
      <div id="dlg-body"></div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
